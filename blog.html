<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Bhavay Tyagi</title>
    <link rel="icon" type="image/png" href="/images/atom.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#050510] text-white font-mono overflow-x-hidden">
    <div id="vanta-bg" class="fixed inset-0 z-0"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <custom-navbar></custom-navbar>

        <main class="flex-grow container mx-auto px-4 py-16">
            <article class="max-w-4xl mx-auto bg-black bg-opacity-70 border border-[#6b6b6b] rounded-lg p-8 shadow-lg shadow-[#6b6b6b]/20">
                <h2 class="text-3xl font-bold mb-8 neon-cyan">Blog</h2>

                <!-- Add a new <li> here for each new post. Duplicate blog/_template.html to start one. -->
                <ul class="space-y-4">
                    <li class="border-b border-[#6b6b6b]/20 pb-4">
                        <a href="blog/welcome-to-the-blog.html" class="text-xl font-bold hover:text-[#d8d8d8] transition-colors">
                            Welcome to the Blog
                        </a>
                    </li>
                </ul>
            </article>
        </main>

        <custom-footer></custom-footer>
    </div>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00f0ff,
            backgroundColor: 0x050510,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });
    </script>
</body>
</html>
