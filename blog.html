<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Bhavay Tyagi</title>
    <link rel="icon" type="image/png" href="/images/atom.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#050510] text-white font-mono overflow-x-hidden">
    <div id="vanta-bg" class="fixed inset-0 z-0"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <custom-navbar></custom-navbar>

        <main class="flex-grow container mx-auto px-4 py-16">
            <article class="max-w-4xl mx-auto bg-black bg-opacity-70 border border-[#6b6b6b] rounded-lg p-8 shadow-lg shadow-[#6b6b6b]/20">
                <h2 class="text-3xl font-bold mb-8 neon-cyan">Blog</h2>

                <!-- Add new posts by appending a new <li> at the bottom, in the order they were written, so numbers stay stable. Duplicate blog/_template.html to start one. -->
                <ol class="space-y-4 list-decimal list-inside marker:text-[#6b6b6b] mb-10">
                    <li class="border-b border-[#6b6b6b]/20 pb-4">
                        <a href="blog/phd-advice-in-the-age-of-ai.html" class="text-xl font-bold hover:text-[#d8d8d8] transition-colors">
                            PhD Advice in the Age of AI
                        </a>
                        <p class="text-sm text-[#6b6b6b] mt-1 ml-6"><time datetime="2026-09">September 2026</time></p>
                    </li>
                </ol>

                <!-- Top 3 posts on X by likes. Always stays below the post list above, regardless of post count. To refresh: pick new posts and swap the status URLs below. -->
                <section>
                    <h3 class="text-xl font-bold mb-4 neon-pink">Top Posts on X</h3>
                    <div class="grid md:grid-cols-3 gap-4">
                        <blockquote class="twitter-tweet" data-theme="dark"><a href="https://twitter.com/bhavaytyagi/status/2091750794336854433"></a></blockquote>
                        <blockquote class="twitter-tweet" data-theme="dark"><a href="https://twitter.com/bhavaytyagi/status/1987753242994810967"></a></blockquote>
                        <blockquote class="twitter-tweet" data-theme="dark"><a href="https://twitter.com/bhavaytyagi/status/2052903927767498992"></a></blockquote>
                    </div>
                </section>
            </article>
        </main>

        <custom-footer></custom-footer>
    </div>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <script>
        feather.replace();
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0xd8d8d8,
            backgroundColor: 0x141414,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });
    </script>
</body>
</html>
