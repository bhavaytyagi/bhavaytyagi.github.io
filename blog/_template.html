<!--
  BLOG POST TEMPLATE — not a real post, not linked from blog.html.

  To write a new post:
  1. Duplicate this file into blog/ with a slug name, e.g. blog/my-new-post.html
  2. Replace the TITLE placeholders, the YYYY-MM/Month YYYY date, and the
     paragraph inside <article>.
  3. Append (don't prepend) a new <li> at the bottom of the <ol> in
     ../blog.html, so post numbers stay stable as new ones are added:
       <li class="border-b border-[#6b6b6b]/20 pb-4">
         <a href="blog/my-new-post.html" class="text-xl font-bold hover:text-[#d8d8d8] transition-colors">
           My New Post
         </a>
         <p class="text-sm text-[#6b6b6b] mt-1 ml-6"><time datetime="YYYY-MM">Month YYYY</time></p>
       </li>
  4. Once there are enough posts to group, this is also where categories
     (e.g. physics / meta / music) could be added, similar to Tao's and
     Scott Aaronson's blogs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITLE | Bhavay Tyagi</title>
    <link rel="icon" type="image/png" href="/images/atom.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[#050510] text-white font-mono overflow-x-hidden">
    <div id="vanta-bg" class="fixed inset-0 z-0"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <custom-navbar base="../"></custom-navbar>

        <main class="flex-grow container mx-auto px-4 py-16">
            <article class="max-w-3xl mx-auto bg-black bg-opacity-70 border border-[#6b6b6b] rounded-lg p-8 shadow-lg shadow-[#6b6b6b]/20">
                <a href="../blog.html" class="cyber-button inline-flex items-center mb-8">
                    <i data-feather="arrow-left" class="mr-2"></i> All Posts
                </a>

                <h1 class="text-3xl font-bold mb-2 neon-cyan">TITLE</h1>
                <p class="text-sm text-[#6b6b6b] mb-6"><time datetime="YYYY-MM">Month YYYY</time></p>

                <div class="space-y-4 leading-relaxed">
                    <p>CONTENT GOES HERE.</p>
                </div>

                <custom-share></custom-share>
            </article>
        </main>

        <custom-footer></custom-footer>
    </div>

    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/share.js"></script>
    <script src="../script.js"></script>
    <script>
        feather.replace();
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0xd8d8d8,
            backgroundColor: 0x141414,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });
    </script>
</body>
</html>
